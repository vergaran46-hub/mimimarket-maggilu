<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMImarket - Deudores</title>
    <link href="assets/css/estilos.css" rel="stylesheet">
    <script src="assets/js/deudores.js"></script>
</head>
<body>
    <button id="btnHamburguesaDash" class="btn-hamburguesa-dash">&#9776;</button>

    <nav class="menuIzquierda">
        <h2 class="menu"><img src="img/Logo_MIMImarket-removebg-preview.png" alt="MIMImarket Logo"></h2>

        <ul class="listaMenu">
            <li><a href="caja.html">Caja Principal</a></li>
            <li><a href="deudores.html">Deudores</a></li>
            <li><a href="inventario.html">Inventario</a></li>
            <li><a href="historial.html">Historial</a></li>
        </ul>
        <button id="btnModoOscuro" class="btn-modo-oscuro" aria-label="Activar modo oscuro"></button>
    </nav>

    <main class="contenido">
        
        <div class="caja caja-formulario">
            <h2 class="tituloCaja">Registrar Nuevo Cliente / Deudor</h2>
            
            <form id="formAdmin">
                <label>Nombre Completo:</label><br>
                <input type="text" id="fNombre" class="inputBuscador" placeholder="Ej: Juan Pérez"><br><br>

                <label>Correo Electrónico:</label><br>
                <input type="text" id="fCorreo" class="inputBuscador" placeholder="ejemplo@correo.com"><br><br>

                <label>Detalle de la Deuda / Mensaje:</label><br>
                <textarea id="fMensaje" class="inputBuscador" rows="4" placeholder="Ingresa los detalles aquí..."></textarea><br><br>

                <button type="submit" class="btnMini btnFormulario">Guardar Registro</button>
                
                <p id="mensajeAlerta"></p>
            </form>
        </div>

        <br><br>

        <h1 class="tituloSeccion">Lista de Fiados</h1>
        <div id="contenedorDeudores"></div>

    </main>

    <script src="assets/js/modoOscuro.js" defer></script>
</body>
</html>
