<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMImarket</title>
    <link href="assets/css/estilos.css" rel="stylesheet">
    <script src="assets/js/caja.js"></script>
</head>
<body>
    <button id="btnHamburguesaDash" class="btn-hamburguesa-dash">&#9776;</button>

    <nav class="menuIzquierda">
        <h2 class="menu">MIMImarket</h2>

        <ul class="listaMenu">
            <li><a href="caja.html">Caja Principal</a></li>
            <li><a href="deudores.html">Deudores</a></li>
            <li><a href="inventario.html">Inventario</a></li>
            <li><a href="historial.html">Historial</a></li>
        </ul>
    </nav>    
        <main class="contenido">
            <div class="caja" style="width: 100%; max-width: 600px;">
                <h2 class="tituloCaja">Registrar Nuevo Cliente / Deudor</h2>
                
                <form id="formAdmin">
                    <label style="color: #5E2145; font-weight: bold;">Nombre Completo:</label><br>
                    <input type="text" id="fNombre" class="inputBuscador" placeholder="Ej: Juan Pérez"><br><br>

                    <label style="color: #5E2145; font-weight: bold;">Correo Electrónico:</label><br>
                    <input type="text" id="fCorreo" class="inputBuscador" placeholder="ejemplo@correo.com"><br><br>

                    <label style="color: #5E2145; font-weight: bold;">Detalle de la Deuda / Mensaje:</label><br>
                    <textarea id="fMensaje" class="inputBuscador" rows="4" placeholder="Ingresa los detalles aquí..."></textarea><br><br>

                    <button type="submit" class="btnMini" style="background-color: #5E2145; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Guardar Registro</button>
                    
                    <p id="mensajeAlerta" style="margin-top: 15px; font-weight: bold; font-family: sans-serif;"></p>
                </form>
            </div>
        </main>



</body>
</html>
