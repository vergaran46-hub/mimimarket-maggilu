<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - MIMImarket</title>
    <link href="/assets/css/estilos.css" rel="stylesheet">
</head>
<body>
    <button id="btnHamburguesaDash" class="btn-hamburguesa-dash">&#9776;</button>

    <nav class="menuIzquierda">
        <h2 class="menu"><img src="/img/Logo_MIMImarket-removebg-preview.png" alt="MIMImarket Logo"></h2>

        <ul class="listaMenu">
            <li><a href="caja.html">Caja Principal</a></li>
            <li><a href="deudores.html">Deudores</a></li>
            <li><a href="inventario.html">Inventario</a></li>
            <li><a href="historial.html">Historial</a></li>
        </ul>
        <button id="btnCerrarSesion" class="btnMini" style="width: 90%; margin: 0 auto 10px;">Cerrar sesión</button>
        <button id="btnModoOscuro" class="btn-modo-oscuro" aria-label="Activar modo oscuro"></button>
    </nav>

    <main class="contenido">
        <h1 class="tituloSeccion">Gestión de Inventario</h1>
        <div id="estadoInventario"></div>

        <div class="division">

            <div class="caja">
                <h2 class="tituloCaja">Agregar Producto</h2>

                <label>Nombre:</label><br>
                <input type="text" id="iNombre" placeholder="Ej: Arroz" class="inputBuscador"><br><br>

                <label>Precio:</label><br>
                <input type="number" id="iPrecio" placeholder="Ej: 1350" class="inputBuscador"><br><br>

                <label>Stock:</label><br>
                <input type="number" id="iStock" placeholder="Ej: 10" class="inputBuscador"><br><br>

                <button id="btnAgregarProducto" class="btnMini">Agregar Producto</button>
            </div>

            <div class="caja">
                <h2 class="tituloCaja">Productos Registrados</h2>

                <table border="1" class="tablaMini">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos"></tbody>
                </table>
            </div>

        </div>
    </main>

    <script type="module" src="/assets/js/inventario.js"></script>
    <script type="module" src="/assets/js/modoOscuro.js"></script>
</body>
</html>
